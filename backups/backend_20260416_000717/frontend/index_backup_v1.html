<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridCheck Pro - Netzanschluss-Diagnose</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f1e; color: #e0e0e0; min-height: 100vh; }

        .header {
            background: linear-gradient(135deg, #0d1b2a, #1b2a4a);
            padding: 18px 30px;
            border-bottom: 2px solid #00b4d8;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { font-size: 22px; color: #00b4d8; letter-spacing: 1px; }
        .header .meta { font-size: 11px; color: #667; text-align: right; line-height: 1.6; }

        .main { display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; }

        .panel {
            background: #111827;
            border: 1px solid #1e3a5f;
            border-radius: 8px;
            padding: 20px;
        }

        .eingabe-panel { width: 350px; flex-shrink: 0; }
        .ergebnis-panel { flex: 1; display: none; flex-direction: column; gap: 16px; min-width: 400px; }
        .netzplan-panel { width: 500px; flex-shrink: 0; display: none; }

        h2 { color: #00b4d8; font-size: 15px; margin-bottom: 14px; padding-bottom: 6px; border-bottom: 1px solid #1e3a5f; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #99a; margin-bottom: 4px; }
        .form-group select,
        .form-group input {
            width: 100%; padding: 8px 10px; background: #0a0f1e; border: 1px solid #1e3a5f;
            border-radius: 4px; color: #e0e0e0; font-size: 13px;
        }
        .form-group select:focus,
        .form-group input:focus { border-color: #00b4d8; outline: none; }

        .btn-check {
            width: 100%; padding: 12px; margin-top: 8px;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #fff; border: none; border-radius: 6px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-check:hover { opacity: 0.85; }
        .btn-check:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-pdf {
            width: 100%; padding: 10px; margin-top: 6px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff; border: none; border-radius: 6px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s; display: none;
        }
        .btn-pdf:hover { opacity: 0.85; }

        .fazit-box {
            padding: 16px; border-radius: 6px; font-size: 14px; font-weight: 600;
            text-align: center; letter-spacing: 0.5px;
        }
        .fazit-gruen { background: #064e3b; border: 1px solid #10b981; color: #10b981; }
        .fazit-gelb { background: #713f12; border: 1px solid #f59e0b; color: #f59e0b; }
        .fazit-rot { background: #7f1d1d; border: 1px solid #ef4444; color: #ef4444; }

        .detail-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .detail-table th { text-align: left; color: #00b4d8; padding: 6px 8px; border-bottom: 1px solid #1e3a5f; }
        .detail-table td { padding: 5px 8px; border-bottom: 1px solid #0d1525; }
        .detail-table tr:hover { background: #0d1525; }

        .empfehlung-item {
            background: #0d1525; border-left: 3px solid #00b4d8;
            padding: 8px 12px; margin-bottom: 6px; border-radius: 0 4px 4px 0;
            font-size: 12px; line-height: 1.5;
        }

        .revision-footer {
            margin-top: 10px; padding-top: 8px; border-top: 1px solid #1e3a5f;
            font-size: 10px; color: #555; text-align: right;
        }

        .n1-ok { color: #10b981; }
        .n1-fail { color: #ef4444; }

        #plotlyNetzplan { width: 100%; height: 480px; }
    </style>
</head>
<body>

<div class="header">
    <h1>GridCheck Pro</h1>
    <div class="meta">Pre-Netzanschluss-Diagnose<br>v1.1 | Revisionssicher | Interaktiv</div>
</div>

<div class="main">

    <!-- EINGABE -->
    <div class="panel eingabe-panel">
        <h2>Anschlussparameter</h2>
        <div class="form-group">
            <label>Spannungsebene</label>
            <select id="spannungsebene">
                <option value="MS">Mittelspannung (MS)</option>
                <option value="HS">Hochspannung (HS)</option>
                <option value="HoeS">Hoechstspannung (HoeS)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Nennspannung (kV)</label>
            <input type="number" id="nennspannung" value="20" step="0.1">
        </div>
        <div class="form-group">
            <label>Anschlussleistung (MW)</label>
            <input type="number" id="leistung_mw" value="10" step="0.1">
        </div>
        <div class="form-group">
            <label>Leistungsfaktor cos phi</label>
            <input type="number" id="cos_phi" value="0.95" step="0.01" min="0.8" max="1.0">
        </div>
        <div class="form-group">
            <label>Anschlussart</label>
            <select id="anschlussart">
                <option value="Einspeisung">Einspeisung (EZA)</option>
                <option value="Entnahme">Entnahme (Last)</option>
                <option value="Speicher">Speicher</option>
            </select>
        </div>
        <div class="form-group">
            <label>Entfernung zum Netzknoten (km)</label>
            <input type="number" id="entfernung_km" value="5" step="0.1">
        </div>
        <div class="form-group">
            <label>Leitungstyp</label>
            <select id="leitungstyp">
                <option value="NAYY150">NAYY 150mm2</option>
                <option value="NAYY185">NAYY 185mm2</option>
                <option value="NA2XS2Y185">NA2XS2Y 185mm2</option>
                <option value="NA2XS2Y240">NA2XS2Y 240mm2</option>
                <option value="AL_STAHL240">AL/Stahl 240/40</option>
            </select>
        </div>
        <div class="form-group">
            <label>Parallele Systeme</label>
            <select id="parallele_systeme">
                <option value="1">1 System</option>
                <option value="2" selected>2 Systeme</option>
                <option value="3">3 Systeme</option>
            </select>
        </div>
        <button class="btn-check" id="btnCheck" onclick="starteCheck()">Netzanschluss pruefen</button>
        <button class="btn-pdf" id="btnPdf" onclick="exportPdf()">PDF-Report exportieren</button>
    </div>

    <!-- ERGEBNIS -->
    <div class="panel ergebnis-panel" id="ergebnisPanel">
        <h2>Analyseergebnis</h2>
        <div id="fazitBox" class="fazit-box"></div>

        <div>
            <h2>Netzdaten</h2>
            <table class="detail-table">
                <tbody id="tabNetzdaten"></tbody>
            </table>
        </div>

        <div>
            <h2>Thermische Analyse</h2>
            <table class="detail-table">
                <tbody id="tabThermisch"></tbody>
            </table>
        </div>

        <div>
            <h2>Spannungsanalyse</h2>
            <table class="detail-table">
                <tbody id="tabSpannung"></tbody>
            </table>
        </div>

        <div>
            <h2>N-1 Sicherheit</h2>
            <div id="n1Ergebnis"></div>
        </div>

        <div>
            <h2>Empfehlungen</h2>
            <div id="empfehlungen"></div>
        </div>

        <div class="revision-footer" id="revisionFooter"></div>
    </div>

    <!-- NETZPLAN -->
    <div class="panel netzplan-panel" id="netzplanPanel">
        <h2>Netzplan (interaktiv)</h2>
        <div id="plotlyNetzplan"></div>
    </div>

</div>

<script>
let letztesDaten = null;

async function starteCheck() {
    const btn = document.getElementById('btnCheck');
    btn.disabled = true;
    btn.textContent = 'Analyse laeuft...';

    const parallele = parseInt(document.getElementById('parallele_systeme').value);

    const params = {
        spannungsebene: document.getElementById('spannungsebene').value,
        nennspannung: parseFloat(document.getElementById('nennspannung').value),
        leistung_mw: parseFloat(document.getElementById('leistung_mw').value),
        cos_phi: parseFloat(document.getElementById('cos_phi').value),
        anschlussart: document.getElementById('anschlussart').value,
        entfernung_km: parseFloat(document.getElementById('entfernung_km').value),
        leitungstyp: document.getElementById('leitungstyp').value,
        parallele_systeme: parallele,
        redundanz: parallele >= 2
    };

    try {
        const res = await fetch('/api/check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(params)
        });

        const data = await res.json();
        if (data.status === 'OK') {
            letztesDaten = data;
            zeigeErgebnis(data);
            document.getElementById('btnPdf').style.display = 'block';
        } else {
            alert('Fehler: ' + JSON.stringify(data.fehler || data.nachricht || 'Unbekannt'));
        }
    } catch (err) {
        alert('Verbindungsfehler: ' + err.message);
    }

    btn.disabled = false;
    btn.textContent = 'Netzanschluss pruefen';
}

function zeigeErgebnis(d) {
    const fb = document.getElementById('fazitBox');
    const klasse = d.fazit.includes('MACHBAR') ? 'fazit-gruen' : d.fazit.includes('AUFLAGEN') ? 'fazit-gelb' : 'fazit-rot';
    fb.className = 'fazit-box ' + klasse;
    fb.textContent = d.fazit;

    // Netzdaten
    document.getElementById('tabNetzdaten').innerHTML =
        zeile('Spannungsebene', d.eingabe.spannungsebene) +
        zeile('Nennspannung', d.eingabe.nennspannung + ' kV') +
        zeile('Leistung', d.eingabe.leistung_mw + ' MW') +
        zeile('cos phi', d.eingabe.cos_phi) +
        zeile('Anschlussart', d.eingabe.anschlussart) +
        zeile('Entfernung', d.eingabe.entfernung_km + ' km') +
        zeile('Leitungstyp', d.eingabe.leitungstyp) +
        zeile('Systeme', d.eingabe.parallele_systeme);

    // Thermisch
    const th = d.thermisch;
    document.getElementById('tabThermisch').innerHTML =
        zeile('Betriebsstrom', th.i_pro_system_a + ' A') +
        zeile('Grenzstrom', th.i_max_a + ' A') +
        zeile('Auslastung', th.auslastung_prozent + ' %') +
        zeile('Status', th.bewertung);

    // Spannung
    const sp = d.spannung;
    document.getElementById('tabSpannung').innerHTML =
        zeile('Delta U', sp.delta_u_prozent + ' %') +
        zeile('Grenzwert', sp.grenzwert_prozent + ' %') +
        zeile('Status', sp.bewertung);

    // N-1
    const n1 = d.n1;
    const n1div = document.getElementById('n1Ergebnis');
    const n1class = n1.n1_sicher ? 'n1-ok' : 'n1-fail';
    n1div.innerHTML = '<table class="detail-table"><tbody>' +
        zeile('N-1 sicher', n1.n1_sicher ? 'JA' : 'NEIN') +
        zeile('Auslastung bei N-1', n1.n1_auslastung_prozent + ' %') +
        zeile('Bewertung', '<span class="' + n1class + '">' + n1.bewertung + '</span>') +
        '</tbody></table>';

    // Empfehlungen
    const ediv = document.getElementById('empfehlungen');
    ediv.innerHTML = d.empfehlungen.map(function(e) {
        return '<div class="empfehlung-item"><strong>Hinweis:</strong> ' + e + '</div>';
    }).join('');

    // Revision
    document.getElementById('revisionFooter').textContent =
        'Revision: ' + (d.revision_id || 'n/a') + ' | ' + (d.zeitstempel || new Date().toISOString());

    // Panels einblenden
    document.getElementById('ergebnisPanel').style.display = 'flex';
    document.getElementById('netzplanPanel').style.display = 'block';

    // Interaktiver Netzplan
    zeichneNetzplanPlotly(d);
}

function zeile(label, wert) {
    return '<tr><td style="color:#99a">' + label + '</td><td style="text-align:right">' + wert + '</td></tr>';
}

function zeichneNetzplanPlotly(d) {
    const farbe = d.fazit.includes('MACHBAR') ? '#10b981' : d.fazit.includes('AUFLAGEN') ? '#f59e0b' : '#ef4444';
    const leitFarbe = d.thermisch.auslastung_prozent > 80 ? '#ef4444' : d.thermisch.auslastung_prozent > 60 ? '#f59e0b' : '#10b981';
    const n1Farbe = d.n1.n1_sicher ? '#10b981' : '#ef4444';

    // Knoten-Positionen
    const knoten = {
        x: [0, 2, 2],
        y: [1, 1, 0],
        text: [
            'Netzknoten<br>' + d.eingabe.nennspannung + ' kV',
            d.eingabe.anschlussart + '<br>' + d.eingabe.leistung_mw + ' MW',
            'N-1 Analyse<br>' + (d.n1.n1_sicher ? 'SICHER' : 'NICHT SICHER') + '<br>Ausl.: ' + d.n1.n1_auslastung_prozent + '%'
        ],
        marker: {
            size: [40, 40, 30],
            color: ['#00b4d8', farbe, n1Farbe],
            line: { width: 2, color: '#1e3a5f' }
        }
    };

    // Leitungen
    const leitungen_x = [0, 2, null, 2, 2, null];
    const leitungen_y = [1, 1, null, 1, 0, null];

    const trace_leitungen = {
        x: leitungen_x, y: leitungen_y,
        mode: 'lines',
        line: { color: leitFarbe, width: 4, dash: 'solid' },
        hoverinfo: 'text',
        text: [d.eingabe.leitungstyp + ' | ' + d.eingabe.entfernung_km + ' km | Ausl.: ' + d.thermisch.auslastung_prozent + '%'],
        showlegend: false
    };

    const trace_knoten = {
        x: knoten.x, y: knoten.y,
        mode: 'markers+text',
        marker: knoten.marker,
        text: knoten.text,
        textposition: ['top center', 'top center', 'bottom center'],
        textfont: { size: 10, color: '#e0e0e0' },
        hoverinfo: 'text',
        hovertext: [
            'Netzknoten: ' + d.eingabe.spannungsebene + ' ' + d.eingabe.nennspannung + ' kV',
            d.eingabe.anschlussart + ': ' + d.eingabe.leistung_mw + ' MW\ncos phi: ' + d.eingabe.cos_phi + '\nStrom: ' + d.thermisch.i_pro_system_a + ' A',
            'N-1: ' + d.n1.bewertung + '\nAuslastung: ' + d.n1.n1_auslastung_prozent + '%'
        ],
        showlegend: false
    };

    const layout = {
        paper_bgcolor: '#111827',
        plot_bgcolor: '#111827',
        font: { color: '#e0e0e0', family: 'Segoe UI' },
        xaxis: { visible: false, range: [-0.8, 3] },
        yaxis: { visible: false, range: [-0.5, 1.8] },
        margin: { l: 10, r: 10, t: 10, b: 10 },
        hovermode: 'closest',
        annotations: [
            {
                x: 1, y: 1.08,
                text: d.eingabe.leitungstyp + ' | ' + d.eingabe.entfernung_km + ' km<br>Ausl.: ' + d.thermisch.auslastung_prozent + '%',
                showarrow: false,
                font: { size: 10, color: leitFarbe }
            },
            {
                x: 1, y: 0.2,
                text: '<b>FAZIT:</b> ' + d.fazit,
                showarrow: false,
                font: { size: 11, color: farbe },
                bordercolor: farbe,
                borderwidth: 1,
                borderpad: 6,
                bgcolor: '#0d1525',
                opacity: 0.95
            }
        ]
    };

    const config = {
        responsive: true,
        displayModeBar: true,
        modeBarButtonsToRemove: ['lasso2d', 'select2d'],
        displaylogo: false
    };

    Plotly.newPlot('plotlyNetzplan', [trace_leitungen, trace_knoten], layout, config);
}

async function exportPdf() {
    if (!letztesDaten) { alert('Erst Analyse durchfuehren!'); return; }
    
    const btn = document.getElementById('btnPdf');
    btn.textContent = 'PDF wird erstellt...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/pdf', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(letztesDaten)
        });

        if (res.ok) {
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'GridCheck_Report_' + (letztesDaten.revision_id || 'report') + '.pdf';
            a.click();
            URL.revokeObjectURL(url);
        } else {
            alert('PDF-Fehler: ' + (await res.text()));
        }
    } catch (err) {
        alert('PDF-Export fehlgeschlagen: ' + err.message);
    }

    btn.textContent = 'PDF-Report exportieren';
    btn.disabled = false;
}
</script>
</body>
</html>

[pytest]
addopts = --import-mode=importlib
testpaths = tests
pythonpath = .
# Perf-Tests werden bei `pytest` ohne expliziten Pfad NICHT gesammelt
# (norecursedirs greift bei Auto-Discovery, aber NICHT bei explizitem
# `pytest tests/perf/ ...`). Zusätzlich skippt
# `tests/perf/conftest.py` einzelne Items, falls der Ordner doch mal
# manuell gesammelt wird, ohne dass `--benchmark-only` gesetzt ist.
norecursedirs = perf
markers =
    benchmark: performance baseline benchmark (run with `pytest backend/tests/perf/ --benchmark-only`, siehe docs/PERF_BASELINE.md)

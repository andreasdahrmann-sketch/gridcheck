[build]

[deploy]
# Release-Phase + Start-Fallback: Railway fuehrt releaseCommand nicht immer aus.
releaseCommand = "python -m alembic upgrade head"
startCommand = "python scripts/ensure_migrations.py && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[build]

[deploy]
# Migrations bei jedem Start (releaseCommand allein reicht auf Railway oft nicht).
startCommand = "python scripts/ensure_migrations.py && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

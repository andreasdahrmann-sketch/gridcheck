name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend (pytest + alembic)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: gridcheck_ci
          POSTGRES_USER: gridcheck
          POSTGRES_PASSWORD: gridcheck_dev_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gridcheck -d gridcheck_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alembic migration check
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg2://gridcheck:gridcheck_dev_2026@localhost:5432/gridcheck_ci
        run: alembic upgrade head

      - name: Run backend tests
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg2://gridcheck:gridcheck_dev_2026@localhost:5432/gridcheck_ci
          TEST_DATABASE_URL: postgresql+psycopg2://gridcheck:gridcheck_dev_2026@localhost:5432/gridcheck_ci
          JWT_SECRET: ci-test-secret-32-characters-minimum-123
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32-characters-123
          TRUSTED_HOSTS: localhost,127.0.0.1
          AUTO_CREATE_SCHEMA: "false"
        run: pytest -q tests

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend toolchain
        run: npm run verify:toolchain

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
